server {

    listen 80:
        server_name _;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set+header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ser+header X-Forwarded-Proto $scheme;
        client_max_dody_size 100M;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }
